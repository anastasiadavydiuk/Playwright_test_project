name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      PORT: 3001
      JWT_KEY: supersecretkey_example

      DEV_DB_USERNAME: root
      DEV_DB_PASSWORD: root
      DEV_DB_NAME: database_development
      DEV_DB_HOSTNAME: 127.0.0.1
      DEV_DB_DIALECT: mysql

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Install mysql client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Create databases
        run: |
          mysql -h 127.0.0.1 -u root -proot -e "CREATE DATABASE database_development;"
          mysql -h 127.0.0.1 -u root -proot -e "CREATE DATABASE database_testing;"
          mysql -h 127.0.0.1 -u root -proot -e "CREATE DATABASE database_production;"

      - name: Run migrations
        run: npm run sqlz -- db:migrate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start app
        run: |
          npm run dev &
          sleep 10

      - name: Run Playwright tests
        run: npx playwright test
        working-directory: playwright-project
